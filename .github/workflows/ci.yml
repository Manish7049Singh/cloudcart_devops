name: CloudCart CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: sqlite:///${{ runner.temp }}/cloudcart-ci.db
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest "httpx<0.28"

      - name: Validate Python syntax and application import
        run: |
          python -m compileall -q app tests
          python -c "from app.main import app; print(f'Imported {app.title}')"

      - name: Run backend test suite
        run: python -m pytest tests -v

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Confirm build output
        run: test -d dist

  docker-verification:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: cloudcart-backend:ci

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: cloudcart-frontend:ci

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    if: always()
    needs: [backend-tests, frontend-build, docker-verification]
    steps:
      - name: Report CI results
        env:
          BACKEND_RESULT: ${{ needs.backend-tests.result }}
          FRONTEND_RESULT: ${{ needs.frontend-build.result }}
          DOCKER_RESULT: ${{ needs.docker-verification.result }}
        run: |
          echo "Backend Tests: ${BACKEND_RESULT}"
          echo "Frontend Build: ${FRONTEND_RESULT}"
          echo "Docker Build Verification: ${DOCKER_RESULT}"
          if [[ "$BACKEND_RESULT" != "success" || "$FRONTEND_RESULT" != "success" || "$DOCKER_RESULT" != "success" ]]; then
            echo "::error::One or more required CI jobs did not succeed."
            exit 1
          fi
